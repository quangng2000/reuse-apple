name: ReusePocket
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
packages:
  ReuseApple:
    path: ../../..
settings:
  base:
    SWIFT_VERSION: '5.0'
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  ReusePocket:
    type: application
    platform: iOS
    sources:
      - ../../Apps/OfflinePrototype
      - path: ../../../models
        buildPhase: resources
        excludes: [realtime-reuse.safetensors, REALTIME-LICENSE.txt]
    dependencies:
      - package: ReuseApple
        product: ReuseAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.quangng2000.ReusePocket
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio to enhance it privately on this device.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  ReusePocket:
    build:
      targets:
        ReusePocket: all
