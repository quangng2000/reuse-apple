name: ReuseStreamingExample
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ReuseApple:
    path: ../../..
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
targets:
  ReuseStreamingExample:
    type: application
    platform: iOS
    sources:
      - App
      - Audio
      - path: ../../../models/realtime-reuse.safetensors
        buildPhase: resources
        optional: true # Prepare the ignored checkpoint, then regenerate before running.
      - path: ../../Research/LICENSE.txt
        buildPhase: resources
      - path: ../../../LICENSE
        buildPhase: resources
      - path: ../../../NOTICE
        buildPhase: resources
      - path: ../../../models/THIRD-PARTY-NOTICES.txt
        buildPhase: resources
    dependencies:
      - package: ReuseApple
        product: ReuseStreaming
      - package: ReuseApple
        product: ReuseAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.quangng2000.reuse-streaming-example
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RE-USE Streaming
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record speech to test streaming enhancement privately on this device.
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  ReuseStreamingExample:
    build:
      targets:
        ReuseStreamingExample: all
