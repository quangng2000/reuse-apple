name: ReuseStreamingEightBenchmark
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ReuseApple:
    path: ../../..
  MLX:
    url: https://github.com/ml-explore/mlx-swift.git
    exactVersion: 0.29.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    SWIFT_COMPILATION_MODE: wholemodule
    CODE_SIGN_STYLE: Automatic
targets:
  ReuseStreamingDiagnosticMac:
    type: framework
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - path: ../Profiling/Generated/Sources/ReuseStreaming
        excludes: [LICENSE]
      - ../Profiling/Support
    dependencies:
      - package: ReuseApple
        product: ReuseAudio
      - package: MLX
        product: MLX
      - package: MLX
        product: MLXFFT
    settings:
      base:
        PRODUCT_NAME: ReuseStreamingDiagnostic
        PRODUCT_MODULE_NAME: ReuseStreamingDiagnostic
        PRODUCT_BUNDLE_IDENTIFIER: io.riftco.reuse-streaming-diagnostic-mac
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        CODE_SIGNING_ALLOWED: NO
        OTHER_SWIFT_FLAGS: '$(inherited) -package-name reuse_apple'
  ReuseStreamingStageProfileMac:
    type: tool
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - ../Profiling/CLI
      - App/EightLayerStageProfile.swift
    dependencies:
      - target: ReuseStreamingDiagnosticMac
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.riftco.reuse-streaming-stage-profile-mac
        CODE_SIGNING_ALLOWED: NO
  ReuseStreamingDiagnostic:
    type: framework
    platform: iOS
    sources:
      - path: ../Profiling/Generated/Sources/ReuseStreaming
        excludes: [LICENSE]
      - ../Profiling/Support
    dependencies:
      - package: ReuseApple
        product: ReuseAudio
      - package: MLX
        product: MLX
      - package: MLX
        product: MLXFFT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.riftco.reuse-streaming-diagnostic
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        OTHER_SWIFT_FLAGS: '$(inherited) -package-name reuse_apple'
  ReuseStreamingReference:
    type: framework
    platform: iOS
    sources:
      - path: ../Reference/Sources/ReuseStreaming
        excludes: [LICENSE]
    dependencies:
      - package: ReuseApple
        product: ReuseAudio
      - package: MLX
        product: MLX
      - package: MLX
        product: MLXFFT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.riftco.reuse-streaming-reference
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        OTHER_SWIFT_FLAGS: '$(inherited) -package-name reuse_apple'
  ReuseStreamingEightBenchmark:
    type: application
    platform: iOS
    sources:
      - App
      - path: BenchAssets
        type: folder
        buildPhase: resources
      - path: ../../Research/LICENSE.txt
        buildPhase: resources
      - path: ../Profiling/Generated/profile-source.json
        buildPhase: resources
    dependencies:
      - target: ReuseStreamingDiagnostic
        embed: false
      - target: ReuseStreamingReference
        embed: false
      - package: ReuseApple
        product: ReuseStreaming
      - package: ReuseApple
        product: ReuseAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.riftco.reuse-streaming-eight-benchmark
        OTHER_SWIFT_FLAGS: '$(inherited) -package-name reuse_apple'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RE-USE Eight Benchmark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  ReuseStreamingStageProfileMac:
    build:
      targets:
        ReuseStreamingStageProfileMac: all
  ReuseStreamingEightBenchmark:
    build:
      targets:
        ReuseStreamingEightBenchmark: all
