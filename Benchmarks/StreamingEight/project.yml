name: ReuseStreamingEightBenchmark
options:
  deploymentTarget:
    iOS: '17.0'
packages:
  ReuseApple:
    path: ../..
  MLX:
    url: https://github.com/ml-explore/mlx-swift.git
    exactVersion: 0.29.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: targeted
    CODE_SIGN_STYLE: Automatic
targets:
  ReuseStreamingReference:
    type: framework
    platform: iOS
    sources:
      - path: ../Reference/Sources/ReuseStreaming
        excludes: [LICENSE]
    dependencies:
      - package: ReuseApple
        product: ReuseAudio
      - package: MLX
        product: MLX
      - package: MLX
        product: MLXFFT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.riftco.reuse-streaming-reference
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: staticlib
        OTHER_SWIFT_FLAGS: '$(inherited) -package-name reuse_apple'
  ReuseStreamingEightBenchmark:
    type: application
    platform: iOS
    sources:
      - App
      - path: BenchAssets
        type: folder
        buildPhase: resources
      - path: ../../Research/LICENSE.txt
        buildPhase: resources
    dependencies:
      - target: ReuseStreamingReference
        embed: false
      - package: ReuseApple
        product: ReuseStreaming
      - package: ReuseApple
        product: ReuseAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.riftco.reuse-streaming-eight-benchmark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RE-USE Eight Benchmark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '1'
schemes:
  ReuseStreamingEightBenchmark:
    build:
      targets:
        ReuseStreamingEightBenchmark: all
