name: Android publisher checks

on:
  push:
    branches: [main]
    paths:
      - 'android/tools/central_*.py'
      - 'android/tools/test_*.py'
      - '.github/workflows/android-publisher-checks.yml'
  pull_request:
    paths:
      - 'android/tools/central_*.py'
      - 'android/tools/test_*.py'
      - '.github/workflows/android-publisher-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-publisher-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publisher-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test Central protocol and failure handling without credentials
        run: python3 -m unittest discover -s android/tools -p 'test_*.py' -v
